# Knowledge distillation. Single teacher: Llama-3.2-3B.
# Default mode is sequence-level KD (teacher generates rationales) which is
# vocabulary-agnostic and fits a 16GB T4 with the student. Logit-level KD is
# available only for a vocab-aligned teacher.
run:
  name: tech0-50m-distill
  out_dir: checkpoints/distill
  seed: 1337
  device: auto

teacher:
  enabled: true
  model_name: meta-llama/Llama-3.2-3B
  load_in_4bit: true
  min_vram_gb: 8          # auto-disable below this (local MX330 has 2GB)

distillation:
  mode: sequence          # sequence | logit
  alpha: 0.5              # weight of KD vs CE: (1-a)CE + a*tau^2*KL
  temperature: 2.0        # tau in [1.5, 2.5]
  top_k: 100

data:
  prompts: data/distill_prompts.jsonl
  out: data/synthetic.jsonl
  max_new_tokens: 512
  num_samples: 100000
  temperature: 0.7
  batch_size: 8

student:
  model_config: configs/model_50m.yaml
  train_jsonl: data/synthetic.jsonl
  seq_len: 2048
  max_steps: 5000
  lr: 2.0e-4
  weight_decay: 0.1
  grad_accum: 8
