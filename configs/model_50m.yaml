# Tech0 50M model architecture.
# Verified parameter budget (~49.62M):
#   tied embeddings : 32000 * 512            = 16.384M
#   backbone (x12)   : attn 655,360
#                      + MLP 2,113,536
#                      + norms 1,024         = 2,769,920 / layer
#   total            : 16.384M + 12*2.76992M + final_norm 512 = 49,623,552
model:
  name: tech0-50m
  vocab_size: 32000
  hidden_size: 512
  num_hidden_layers: 12
  num_attention_heads: 8
  num_key_value_heads: 2          # GQA: 8 query heads, 2 KV heads
  head_dim: 64                    # hidden_size / num_attention_heads
  intermediate_size: 1376         # SwiGLU, ~2.69x hidden
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_bias: false
  mlp_bias: false
  initializer_range: 0.02
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  use_cache: true
