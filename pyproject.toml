[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech0"
version = "0.1.0"
description = "Tech0 - a 50M parameter decoder-only language model (pure PyTorch from scratch)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "tokenizers>=0.19",
    "datasets>=2.19",
    "safetensors>=0.4",
]

[project.optional-dependencies]
teacher = ["transformers>=4.45", "accelerate>=0.34", "bitsandbytes>=0.43"]
dev = ["pytest>=8.0"]

[project.scripts]
tech0-pretrain = "tech0.train.train_pretrain:main"
tech0-distill = "tech0.train.distill:main"
tech0-sft = "tech0.train.sft:main"
tech0-eval = "tech0.eval.run_all:main"
tech0-prepare = "tech0.data.prepare:main"
tech0-tokenizer = "tech0.tokenizer.build_bpe:main"

[tool.setuptools.packages.find]
where = ["src"]
